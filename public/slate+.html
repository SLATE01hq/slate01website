<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLATE+ AI Platform Prototype</title>
  <style>
    :root {
      --bg: #0b0d0d;
      --panel: #121516;
      --panel-2: #171b1c;
      --border: #2d373a;
      --text: #b8daee;
      --muted: #a1a1aa;
      --accent: #ffffff;
      --accent-dark: #0f1112;
      --user: #1f2425;
      --assistant: #101214;
      --danger: #b91c1c;
      --hover: #4f6770;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 290px 1fr;
      height: 100vh;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand span {
      font-size: .8rem;
      color: var(--muted);
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: .18s ease;
      font-size: .95rem;
    }

    .btn:hover {
      background: var(--hover);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-dark);
      border-color: transparent;
      font-weight: 600;
    }

    .btn-primary:hover {
      opacity: .92;
    }

    .model-select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    .conversation-list {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .conversation-item {
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: .18s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .conversation-item:hover {
      background: var(--hover);
    }

    .conversation-item.active {
      background: #1b1b22;
      border-color: #4d6568;
    }

    .conversation-title {
      font-size: .92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .delete-btn:hover {
      color: #fff;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.06), transparent 24%),
        linear-gradient(180deg, #0c0c10 0%, #0b0b0d 100%);
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(11,11,13,.85);
      backdrop-filter: blur(12px);
    }

    .topbar-left h2 {
      font-size: 1rem;
      font-weight: 650;
    }

    .topbar-left p {
      color: var(--muted);
      font-size: .88rem;
      margin-top: 3px;
    }

    .chat-area {
      overflow-y: auto;
      padding: 26px 18px;
    }

    .chat-wrap {
      width: min(900px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      margin: auto;
      width: min(760px, 100%);
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .welcome h3 {
      color: var(--text);
      font-size: 2rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .welcome p {
      line-height: 1.65;
      font-size: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .message.user {
      background: var(--user);
      align-self: flex-end;
      max-width: min(80%, 760px);
    }

    .message.assistant {
      background: var(--assistant);
      align-self: stretch;
    }

    .message-role {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .message-content {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: .98rem;
    }

    .composer-shell {
      padding: 18px;
      border-top: 1px solid var(--border);
      background: rgba(11,11,13,.9);
      backdrop-filter: blur(12px);
    }

    .composer {
      width: min(900px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .composer textarea {
      width: 100%;
      min-height: 72px;
      max-height: 200px;
      resize: vertical;
      background: transparent;
      color: var(--text);
      border: none;
      outline: none;
      font-size: 1rem;
      line-height: 1.5;
      padding: 10px;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 2px;
      flex-wrap: wrap;
    }

    .composer-meta {
      color: var(--muted);
      font-size: .82rem;
    }

    .composer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .92rem;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d4d4d8;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.7); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .message.user {
        max-width: 100%;
      }


    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div>
            <h1><a href="./" style="color: #ffffff; text-decoration: none;">SLATE <img src="images/slate01_01black.png" width="25px" oncontextmenu="return false;"></a></h1>
            <span>Prototype interface</span>
          </div>
        </div>
        <button id="newChatBtn" class="btn btn-primary">+ New chat</button>
        <select id="modelSelect" class="model-select"><option value="slate-1.0">SLATE+ 0.1</option>
          <option value="slate-2.0">SLATE+ 0.2</option>
          <option value="slate-3.0">SLATE+ 0.3</option>
          <option value="slate-4.0">SLATE+ 0.4</option>
        </select>
      </div>

      <div id="conversationList" class="conversation-list"></div>

      <div class="sidebar-footer">
        Static prototype for SLATE01, SLATE+.<br>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <h2 id="chatTitle">New Conversation</h2>
          <p>This is only a prototype so nothing is being saved, & there's no real model available.</p>
        </div>
        <button id="clearMessagesBtn" class="btn">Clear current chat</button>
      </div>

      <section id="chatArea" class="chat-area">
        <div id="chatWrap" class="chat-wrap"></div>
      </section>

      <div class="composer-shell">
        <div class="composer">
          <textarea id="messageInput" placeholder="Message SLATE+..."></textarea>
          <div class="composer-actions">
            <div class="composer-meta">Enter to send · Shift+Enter for new line</div>
            <div class="composer-right">
              <div id="typingIndicator" class="typing hidden">
                <span></span><span></span><span></span>
              </div>
              <button id="sendBtn" class="btn btn-primary">Send</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'slate01-ai-platform-conversations';

    let conversations = loadConversations();
    let activeConversationId = conversations[0]?.id || null;

    const conversationList = document.getElementById('conversationList');
    const chatWrap = document.getElementById('chatWrap');
    const chatTitle = document.getElementById('chatTitle');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const clearMessagesBtn = document.getElementById('clearMessagesBtn');
    const modelSelect = document.getElementById('modelSelect');
    const typingIndicator = document.getElementById('typingIndicator');

    if (!activeConversationId) {
      createConversation();
    }

    renderAll();

    newChatBtn.addEventListener('click', () => {
      createConversation();
      renderAll();
      messageInput.focus();
    });

    clearMessagesBtn.addEventListener('click', () => {
      const convo = getActiveConversation();
      if (!convo) return;
      convo.messages = [];
      convo.title = 'New Conversation';
      saveConversations();
      renderAll();
    });

    sendBtn.addEventListener('click', handleSend);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function createConversation() {
      const newConversation = {
        id: crypto.randomUUID(),
        title: 'New Conversation',
        model: modelSelect?.value || 'slate-1.0',
        messages: []
      };
      conversations.unshift(newConversation);
      activeConversationId = newConversation.id;
      saveConversations();
    }

    function getActiveConversation() {
      return conversations.find(c => c.id === activeConversationId);
    }

    function renderAll() {
      renderConversationList();
      renderMessages();
      syncModelSelection();
    }

    function renderConversationList() {
      conversationList.innerHTML = '';

      conversations.forEach(convo => {
        const item = document.createElement('div');
        item.className = `conversation-item ${convo.id === activeConversationId ? 'active' : ''}`;

        const title = document.createElement('div');
        title.className = 'conversation-title';
        title.textContent = convo.title || 'Untitled Chat';
        title.addEventListener('click', () => {
          activeConversationId = convo.id;
          renderAll();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = 'Delete conversation';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteConversation(convo.id);
        });

        item.appendChild(title);
        item.appendChild(deleteBtn);
        item.addEventListener('click', () => {
          activeConversationId = convo.id;
          renderAll();
        });
        conversationList.appendChild(item);
      });
    }

    function renderMessages() {
      const convo = getActiveConversation();
      if (!convo) return;

      chatTitle.textContent = convo.title || 'New Conversation';
      chatWrap.innerHTML = '';

      if (!convo.messages.length) {
        const welcome = document.createElement('div');
        welcome.className = 'welcome';
        welcome.innerHTML = `
          <h3>SLATE+ platform prototype</h3>
          <p>
            This is the front-end shell for a AI chat web app. The sidebar stores conversations locally,
            SLATE01 is working on the backend to bring you the fully functional version of this prototype. <br><br>
          </p>
        `;
        chatWrap.appendChild(welcome);
        return;
      }

      convo.messages.forEach(msg => {
        const message = document.createElement('div');
        message.className = `message ${msg.role}`;

        const role = document.createElement('div');
        role.className = 'message-role';
        role.textContent = msg.role === 'user' ? 'You' : 'SLATE+';

        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = msg.content;

        message.appendChild(role);
        message.appendChild(content);
        chatWrap.appendChild(message);
      });

      document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    }

    function syncModelSelection() {
      const convo = getActiveConversation();
      if (!convo) return;
      modelSelect.value = convo.model || 'SLATE+ 0.1';
    }

    modelSelect.addEventListener('change', () => {
      const convo = getActiveConversation();
      if (!convo) return;
      convo.model = modelSelect.value;
      saveConversations();
    });

    async function handleSend() {
      const prompt = messageInput.value.trim();
      if (!prompt) return;

      const convo = getActiveConversation();
      if (!convo) return;

      convo.messages.push({ role: 'user', content: prompt });
      if (convo.title === 'New Conversation') {
        convo.title = prompt.slice(0, 32) + (prompt.length > 32 ? '...' : '');
      }
      convo.model = modelSelect.value;
      saveConversations();
      renderAll();

      messageInput.value = '';
      setTyping(true);

      try {
        const assistantReply = await getAssistantResponse(convo);
        convo.messages.push({ role: 'assistant', content: assistantReply });
      } catch (error) {
        convo.messages.push({
          role: 'assistant',
          content: 'There was an error connecting to the model. For production, route requests through Firebase Functions or your own backend and keep secrets off the client.'
        });
        console.error(error);
      }

      setTyping(false);
      saveConversations();
      renderAll();
    }

    function setTyping(show) {
      typingIndicator.classList.toggle('hidden', !show);
    }

    async function getAssistantResponse(convo) {
      // =====================================================
      // PROTOTYPE MODE
      // =====================================================
      // This fallback makes the UI feel functional before you
      // wire up the real backend. Replace this block with your
      // secure API route when ready.
      //
      // Example production architecture:
      // Browser -> Firebase Hosting front end
      // Front end -> Firebase Function / secure backend
      // Backend -> OpenAI API
      // =====================================================

      await new Promise(resolve => setTimeout(resolve, 900));

      const latestUserMessage = convo.messages[convo.messages.length - 1]?.content || '';

      return `This is only a prototype, we're working on it.`;
    }

    // =====================================================
    // OPTIONAL REAL FETCH EXAMPLE
    // =====================================================
    // Replace getAssistantResponse() above with something like:
    //
    // async function getAssistantResponse(convo) {
    //   const response = await fetch('/api/chat', {
    //     method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify({
    //       model: convo.model,
    //       messages: convo.messages
    //     })
    //   });
    //
    //   if (!response.ok) {
    //     throw new Error('Failed to get response');
    //   }
    //
    //   const data = await response.json();
    //   return data.reply;
    // }
    // =====================================================

    function deleteConversation(id) {
      conversations = conversations.filter(c => c.id !== id);
      if (!conversations.length) {
        createConversation();
      } else if (activeConversationId === id) {
        activeConversationId = conversations[0].id;
      }
      saveConversations();
      renderAll();
    }

    function saveConversations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }

    function loadConversations() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }
  </script>
</body>
</html>
